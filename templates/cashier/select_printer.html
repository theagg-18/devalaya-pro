{% extends "base.html" %}

{% block head %}
<style>
    /* Hallmark · app screen · redesign: polish */
    .printer-option { white-space: nowrap; }
</style>
{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 4rem auto;">
    <div style="text-align: center;">
        <h2>Select Printer</h2>
        <p class="text-muted" style="margin-bottom: 2rem;">Please select a printer to start your session.</p>

        {% if printers %}
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            {% for printer in printers %}
            <form method="post">
                <input type="hidden" name="printer_id" value="{{ printer.id }}">
                <button type="submit" class="card printer-option"
                    style="width: 100%; text-align: left; cursor: pointer; border: 2px solid transparent; transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;">
                    <span style="display: block; font-weight: 700; color: var(--primary); overflow: hidden; text-overflow: ellipsis;">{{ printer.friendly_name }}</span>
                    <!-- We could show status here if we checked it -->
                    <span style="display: block; font-size: 0.9rem; color: var(--text-muted);">Tap to select</span>
                </button>
            </form>
            {% endfor %}
        </div>
        {% else %}
        <div class="alert alert-warning">
            No active printers found. Please contact Admin.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
