{% extends "base.html" %}

{% block content %}
<div
    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
    <div>
        <h2>Cashier: {{ g.user.username }}</h2>
        <p class="text-muted">
            Printer: <strong>{{ printer.friendly_name }}</strong>
            <a href="{{ url_for('cashier.release_printer') }}"
                style="font-size: 0.8rem; margin-left: 8px; color: #ef4444;">Change</a>
        </p>
    </div>
</div>

<div class="card" style="min-height: 400px; display: flex; align-items: center; justify-content: center;">
    <div class="text-center">
        <h3>Billing Mode Selection</h3>
        <p class="text-muted mb-4">Select a mode to proceed</p>

        <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center;">
            <a href="{{ url_for('cashier.start_billing') }}" class="btn btn-primary"
                style="padding: 1.75rem; display: flex; flex-direction: column; gap: 0.85rem; width: 100%; max-width: 250px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 2v20l2-1.5L8 22l2-1.5L12 22l2-1.5L16 22l2-1.5L20 22V2l-2 1.5L16 2l-2 1.5L12 2l-2 1.5L8 2 6 3.5 4 2z"></path>
                    <line x1="8" y1="7" x2="16" y2="7"></line>
                    <line x1="8" y1="11" x2="16" y2="11"></line>
                    <line x1="8" y1="15" x2="13" y2="15"></line>
                </svg>
                <span>New Bill</span>
            </a>

            <a href="{{ url_for('cashier.history') }}" class="btn btn-secondary"
                style="padding: 1.75rem; display: flex; flex-direction: column; gap: 0.85rem; width: 100%; max-width: 250px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v5h5"></path>
                    <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path>
                    <line x1="12" y1="7" x2="12" y2="12"></line>
                    <polyline points="12 12 15 14"></polyline>
                </svg>
                <span>History / Reprint</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
